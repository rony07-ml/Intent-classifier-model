apiVersion: v1
kind: deployment
metadata:
  name: intent-deployment
  namespace: intent-namespace
  labels:
    app: intent-classifier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intent-classifier
  template:
    metadata:
      labels:
        app: intent-classifier
    spec:
      containers:
        - name: intent-classifier
          image: rony07ml/intent-classifier:latest
          ports:
            - containerPort: 6000